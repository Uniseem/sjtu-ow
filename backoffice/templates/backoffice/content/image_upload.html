{% extends "backoffice/base.html" %}

{% block content %}
  <form method="post" enctype="multipart/form-data" class="b-form">
    {% csrf_token %}
    <div class="b-fieldset">
      {% include "backoffice/parts/fields.html" %}
      <div class="c-field">
        <label class="c-field__label" for="id_files">图片<span class="c-field__req" aria-hidden="true">*</span></label>
        <input type="file" name="files" id="id_files" accept=".jpg,.jpeg,.png,.webp" multiple required>
        <div class="c-field__help">可以一次选多张。JPG、PNG、WebP，每张不超过 5 MB；JPG 和 PNG 会转成 WebP。标题先用文件名，传完可以改。</div>
      </div>
    </div>
    <div class="b-actions">
      <button type="submit" class="c-btn c-btn--primary">上传</button>
      <a class="c-btn c-btn--secondary" href="{{ back_url }}">不传了</a>
    </div>
  </form>
{% endblock %}
