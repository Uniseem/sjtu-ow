{% extends "backoffice/base.html" %}

{% block content %}
  <form method="post" class="b-form" novalidate>
    {% csrf_token %}
    <div class="b-fieldset">
      {% if intro %}<p class="b-section__text">{{ intro }}</p>{% endif %}
      {% include "backoffice/parts/fields.html" %}
    </div>
    <div class="b-actions">
      <button type="submit" class="c-btn c-btn--primary">{{ submit_label|default:"保存" }}</button>
      {% if back_url %}<a class="c-btn c-btn--secondary" href="{{ back_url }}">不改了</a>{% endif %}
    </div>
  </form>
{% endblock %}
