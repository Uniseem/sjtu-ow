<figure class="border border-rule bg-sunken">
  {% if embed_src %}
    <iframe
      src="{{ embed_src }}"
      title="嵌入视频"
      allowfullscreen
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  {% elif value.url %}
    <p class="p-4"><a href="{{ value.url }}">观看视频</a></p>
  {% endif %}
</figure>
