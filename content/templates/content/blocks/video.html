<div class="aspect-video w-full overflow-hidden rounded-box bg-base-300">
  {% if embed_src %}
    <iframe
      class="h-full w-full"
      src="{{ embed_src }}"
      title="嵌入视频"
      allowfullscreen
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  {% elif value.url %}
    <p class="p-4">
      <a class="link" href="{{ value.url }}">观看视频</a>
    </p>
  {% endif %}
</div>
