<section class="w-panel">
  <div class="w-flex w-flex-wrap w-items-center w-justify-between w-gap-4">
    <h2 class="w-panel__heading">我的投稿</h2>
    <a href="{{ create_url }}" class="button">新建投稿</a>
  </div>
  {% if rows %}
    <table class="listing">
      <thead>
        <tr>
          <th>标题</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            <td>
              <a href="{{ row.edit_url }}">{{ row.title }}</a>
            </td>
            <td>{{ row.status }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="help">还没有稿件。点「新建投稿」开始写第一篇。</p>
  {% endif %}
</section>
