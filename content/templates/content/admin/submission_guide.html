<div class="help-block help-info" data-submission-guide>
  <ul>
    <li>填好标题、选分类，摘要写一两句，会显示在文章列表和分享卡片上。</li>
    <li>正文用 Markdown 写，工具栏有加粗、标题、列表、链接这些按钮，点最右边的「?」看写法。图片点图片按钮、拖进来或直接粘贴就会上传，单独一行的图片方括号里写图注；B 站视频把链接单独贴一行。点眼睛图标看排出来的样子。</li>
    <li>写到一半可以点底部的「保存草稿」，以后在后台首页「我的投稿」里接着写。</li>
    <li>写完点底部的「发布」就上线了，不用等审核。发布后 AI 会定时检查，有问题管理员会联系你或者撤下。改已发布的文章，改完再点一次「发布」。</li>
    <li>上面的「推广」「设置」两页不用管。</li>
  </ul>
</div>
