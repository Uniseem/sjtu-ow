{% extends "base.html" %}

{% block title %}投稿 · 上海交通大学守望先锋社区{% endblock %}

{% block content %}
  <section class="mx-auto w-full max-w-3xl px-4 py-8">
    <h1 class="mb-4">投稿</h1>
    <p class="mb-6 text-base-content/70">目前还不能投稿，原因如下：</p>
    <ul class="mb-8 list-disc space-y-2 pl-6">
      {% for reason in reasons %}
        <li>{{ reason }}</li>
      {% endfor %}
    </ul>
    {% if login_url %}
      <a href="{{ login_url }}" class="btn btn-primary min-h-11 font-button">去登录</a>
    {% else %}
      <a href="{% url 'me_profile' %}" class="btn btn-ghost min-h-11 font-button">返回个人中心</a>
    {% endif %}
  </section>
{% endblock %}
