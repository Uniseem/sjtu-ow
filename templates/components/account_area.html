{% if user.is_authenticated %}
  <span class="hidden sm:inline">{{ user.nickname }}</span>
  <a href="{% url 'me_profile' %}" class="inline-flex min-h-9 items-center">个人中心</a>
  <a href="{% url 'account_logout' %}" class="inline-flex min-h-9 items-center">退出</a>
{% else %}
  <a href="{% url 'account_login' %}" class="inline-flex min-h-9 items-center">登录</a>
  <a href="{% url 'account_signup' %}" class="inline-flex min-h-9 items-center">注册</a>
{% endif %}
