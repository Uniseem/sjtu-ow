{% comment %}
  Section head (design 13.2.6): the title and an optional "全部 →" link.
{% endcomment %}
<div class="c-sectionhead">
  <h2{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</h2>
  {% if more_url %}<a href="{{ more_url }}" class="c-btn c-btn--quiet">{{ more_label|default:"全部" }}{% include "components/icon.html" with name="arrow-right" %}</a>{% endif %}
</div>
