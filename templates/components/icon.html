{% comment %}
  Line icons drawn for this site (round 065), 24×24, stroke = currentColor.

{% endcomment %}
<svg class="{{ class|default:'size-6' }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  {% elif name == "shield" %}<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8-7.5 9.5-4.3-1.5-7.5-4.9-7.5-9.5V6L12 3z"/>

  {% endif %}
</svg>
