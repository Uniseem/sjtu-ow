<div id="slot-home-lfg" data-slot="home-lfg" class="lfg-strip"{% if oob %} hx-swap-oob="true"{% endif %}>
  <span class="lfg-strip__label">组队大厅</span>
  <span class="min-w-0 flex-1 truncate">
    {% if request.user.is_authenticated and lfg_open_count is not None %}

    {% else %}
      登录后查看
    {% endif %}
  </span>
  <a href="/lfg/" class="shrink-0 text-primary hover:underline">进入 ›</a>
</div>
