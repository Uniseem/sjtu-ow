<nav class="mb-6" aria-label="个人中心">
  <ul class="menu bg-base-200 rounded-box hidden lg:flex">
    {% for name, label, available in me_nav %}
      <li>
        {% if available %}
          <a href="{% url name %}" {% if current_me == name %}class="menu-active" aria-current="page"{% endif %}>{{ label }}</a>
        {% else %}
          <span class="text-base-content/40">{{ label }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
  <div class="lg:hidden overflow-x-auto">
    <div class="tabs tabs-box flex-nowrap" role="tablist" aria-label="个人中心">
      {% for name, label, available in me_nav %}
        {% if available %}
          <a href="{% url name %}" role="tab" class="tab shrink-0 {% if current_me == name %}tab-active{% endif %}">{{ label }}</a>
        {% else %}
          <span role="tab" class="tab tab-disabled shrink-0">{{ label }}</span>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</nav>
