<div id="profile-incomplete" {% if oob %}hx-swap-oob="true"{% endif %}>
  {% if profile_gaps %}
    <div class="c-notice c-notice--warn" role="status">
      {% include "components/icon.html" with name="alert" %}
      <div class="c-notice__body">
        <p class="font-semibold">资料尚未完整，报名赛事和内战前需要补全：</p>
        <ul class="mt-1 list-[square] pl-5">
          {% for label, url_name, hint in profile_gaps %}
            <li><a href="{% url url_name %}">{{ label }}</a><span class="text-fg-2"> — {{ hint }}</span></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  {% endif %}
</div>
