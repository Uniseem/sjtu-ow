{% extends "account/layout.html" %}

{% block head_title %}退出登录{% endblock %}

{% block account_content %}
  <h1>退出登录</h1>
  <p>确定要退出当前账号吗？</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {{ redirect_field }}
    <button type="submit" class="c-btn c-btn--primary">退出</button>
    <a href="{% url 'home' %}" class="c-btn c-btn--quiet">取消</a>
  </form>
{% endblock %}
