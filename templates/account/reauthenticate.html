{% extends "account/layout.html" %}

{% block head_title %}确认身份{% endblock %}

{% block account_content %}
  <h1>确认身份</h1>
  <p>为了保护账号，请再次输入密码。</p>
  {% block reauthenticate_content %}
    <form method="post" action="{% url 'account_reauthenticate' %}">
      {% csrf_token %}
      {% include "account/_form.html" %}
      <button type="submit" class="c-btn c-btn--primary">确认</button>
    </form>
  {% endblock %}
{% endblock %}
