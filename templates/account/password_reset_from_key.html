{% extends "account/layout.html" %}

{% block head_title %}设置新密码{% endblock %}

{% block account_content %}
  <h1>设置新密码</h1>
  {% if token_fail %}
    <p>
      重置链接无效或已使用。请
      <a href="{% url 'account_reset_password' %}" class="c-link">重新申请</a>。
    </p>
  {% else %}
    <form method="post" action="{{ action_url }}">
      {% csrf_token %}
      {% include "account/_form.html" %}
      <button type="submit" class="c-btn c-btn--primary">保存新密码</button>
    </form>
  {% endif %}
{% endblock %}
