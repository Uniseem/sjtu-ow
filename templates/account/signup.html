{% extends "account/layout.html" %}

{% block head_title %}注册{% endblock %}

{% block account_content %}
  <h1>注册</h1>
  <p>已经有账号？<a href="{{ login_url }}" class="c-link">登录</a></p>
  <form method="post" action="{% url 'account_signup' %}">
    {% csrf_token %}
    {% include "account/_form.html" %}
    <p class="text-sm text-fg-2">用户协议和隐私政策内容由社团提供。两个同意必须分别勾选。</p>
    <div><button type="submit" class="c-btn c-btn--primary c-btn--block">注册</button></div>
  </form>
{% endblock %}

{% block account_aside %}{% include "account/_why.html" %}{% endblock %}
