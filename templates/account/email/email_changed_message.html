{% extends "email/layout.html" %}
{% block preheader %}你的登录邮箱已从 {{ from_email }} 改为 {{ to_email }}。{% endblock %}
{% block body %}
<p style="margin:0 0 16px;">你的登录邮箱已从 {{ from_email }} 改为 {{ to_email }}。</p>
<p style="margin:16px 0 0;color:#4a505b;font-size:14px;">如果这不是你本人的操作，请立即联系管理员。</p>
{% endblock %}
{% block reason %}你收到这封邮件，是因为这个邮箱是你在本站的登录邮箱。{% endblock %}
