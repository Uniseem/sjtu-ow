{% extends "account/layout.html" %}

{% block head_title %}找回密码{% endblock %}

{% block account_content %}
  <h1>输入找回密码验证码</h1>
  <p class="mt-2 mb-6 text-base-content/80">
    验证码已发送到 <a href="mailto:{{ email }}" class="link">{{ email }}</a>。
  </p>
  <form method="post" action="{% url 'account_confirm_password_reset_code' %}" class="flex flex-col gap-4">
    {% csrf_token %}
    {% include "account/_form.html" with form=verify_form %}
    <button type="submit" class="btn btn-primary min-h-11 font-button">确认</button>
  </form>
  {% if can_resend %}
    <form method="post" action="{% url 'account_confirm_password_reset_code' %}" class="mt-4">
      {% csrf_token %}
      {{ redirect_field }}
      <input type="hidden" name="action" value="resend">
      <button type="submit" class="btn btn-ghost min-h-11 font-button">重新发送验证码</button>
    </form>
  {% endif %}
{% endblock %}
