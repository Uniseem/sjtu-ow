{% extends "account/layout.html" %}

{% block head_title %}找回密码{% endblock %}

{% block account_content %}
  <h1>输入找回密码验证码</h1>
  <p>
    验证码已发送到 <a href="mailto:{{ email }}" class="c-link">{{ email }}</a>。
  </p>
  <form method="post" action="{% url 'account_confirm_password_reset_code' %}">
    {% csrf_token %}
    {% include "account/_form.html" with form=verify_form %}
    <button type="submit" class="c-btn c-btn--primary">确认</button>
  </form>
  {% if can_resend %}
    <form method="post" action="{% url 'account_confirm_password_reset_code' %}">
      {% csrf_token %}
      {{ redirect_field }}
      <input type="hidden" name="action" value="resend">
      <button type="submit" class="c-btn c-btn--quiet">重新发送验证码</button>
    </form>
  {% endif %}
{% endblock %}
