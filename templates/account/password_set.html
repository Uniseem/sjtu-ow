{% extends "account/layout.html" %}

{% block head_title %}设置密码{% endblock %}

{% block account_content %}
  <h1>设置密码</h1>
  <form method="post" action="{% url 'account_set_password' %}" class="mt-6 flex flex-col gap-4">
    {% csrf_token %}
    {% include "account/_form.html" %}
    <button type="submit" class="btn btn-primary min-h-11 font-button">保存</button>
  </form>
{% endblock %}
