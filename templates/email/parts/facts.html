<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" data-letter-facts style="margin:8px 0 24px;background-color:#f1eee8;border-radius:6px;">
  {% for label, value in facts %}
  <tr>
    <td style="padding:10px 16px;width:88px;color:#5a6373;font-size:14px;vertical-align:top;white-space:nowrap;{% if not forloop.first %}border-top:1px solid #dcd5c9;{% endif %}">{{ label }}</td>
    <td style="padding:10px 16px 10px 0;color:#1d2531;font-size:15px;font-weight:600;vertical-align:top;word-break:break-all;{% if not forloop.first %}border-top:1px solid #dcd5c9;{% endif %}">{{ value }}</td>
  </tr>
  {% endfor %}
</table>
