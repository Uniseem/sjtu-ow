{% load static %}
<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171a20" media="(prefers-color-scheme: dark)">
    <title>{% block title %}出错了 · 上海交通大学守望先锋社区{% endblock %}</title>
    {% if error_css_inline %}
      <style>
{{ error_css_inline|safe }}
      </style>
    {% else %}
      <link rel="stylesheet" href="{% static 'css/error.css' %}">
    {% endif %}
  </head>
  <body>
    <header>
      <a href="/" class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#a4161a"/><path d="M8 21.5l8-8 8 8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>交大守望先锋</a>
    </header>
    <main>
      <p class="code" aria-hidden="true">{% block code %}!{% endblock %}</p>
      {% block error_body %}{% endblock %}
    </main>
    <footer>学生社团自办网站 · 不是上海交通大学官方网站</footer>
  </body>
</html>
