{% extends "wagtailadmin/generic/base.html" %}

{% block titletag %}关闭车帖{% endblock %}

{% block main_content %}
  <dl>
    <dt>车主</dt><dd>{{ post.owner.nickname }}</dd>
    <dt>模式</dt><dd>{{ post.mode.name }}</dd>
    <dt>开车时间</dt><dd>{{ post.start_at }}</dd>
    <dt>备注</dt><dd>{{ post.note|default:"—" }}</dd>
  </dl>
  <p>关闭后这条车帖不再显示，车主也不能重新打开。</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="button serious">确认关闭</button>
    <a class="button button-secondary" href="{% url 'lfg_posts:index' %}">取消</a>
  </form>
{% endblock %}
