{% if interactive and comment.author_id == request.user.id and not comment.is_hidden %}
  <details>
    <summary class="c-act">{% include "components/icon.html" with name="edit" %}编辑</summary>
    <form method="post" action="{% url 'comment_edit' comment.pk %}" class="c-composer mt-2"
          hx-post="{% url 'comment_edit' comment.pk %}" hx-target="#slot-article-comments" hx-swap="outerHTML">
      {% csrf_token %}
      <textarea name="body" rows="3" maxlength="500" required class="c-input" aria-label="修改评论">{{ comment.body }}</textarea>
      <div class="c-composer__bar"><button type="submit" class="c-btn c-btn--primary c-btn--sm">保存修改</button></div>
    </form>
  </details>
  <button type="button" class="c-act c-act--danger" hx-post="{% url 'comment_delete' comment.pk %}" hx-target="#slot-article-comments" hx-swap="outerHTML" hx-confirm="删除这条评论？删除后不能恢复。">{% include "components/icon.html" with name="trash" %}删除</button>
{% endif %}
