{% if interactive and request.user.is_authenticated %}
  <button type="button" class="c-act"
          hx-post="{% url 'comment_like' comment.pk %}" hx-target="#slot-article-comments" hx-swap="outerHTML"
          aria-pressed="{% if comment.pk in liked %}true{% else %}false{% endif %}">
    {% include "components/icon.html" with name="heart" %}{% if comment.pk in liked %}已赞{% else %}赞{% endif %} <span class="font-numeric" data-like-count>{{ comment.like_count }}</span>
  </button>
{% else %}
  <span class="c-act">{% include "components/icon.html" with name="heart" %}赞 <span class="font-numeric" data-like-count>{{ comment.like_count }}</span></span>
{% endif %}
