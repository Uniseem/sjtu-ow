<form method="post" action="{% url 'scrim_signup' scrim.pk %}" class="c-form">
  {% csrf_token %}
  <div class="c-field">
    <label class="c-field__label" for="scrim-account-{{ scrim.pk }}">游戏 ID<span class="c-field__req" aria-hidden="true">*</span></label>
    <select id="scrim-account-{{ scrim.pk }}" name="game_account" required>
      {% for account in game_accounts %}
        <option value="{{ account.pk }}" {% if my_signup and my_signup.game_account_id == account.pk %}selected{% endif %}>{{ account.battletag }}</option>
      {% endfor %}
    </select>
  </div>
  <fieldset class="c-field">
    <legend class="c-field__label mb-2">能打的位置（至少一个）</legend>
    <div class="c-choices">
      {% for value, label in role_choices %}
        <label class="c-choice">
          <input type="checkbox" name="roles" value="{{ value }}"
                 {% if my_signup %}{% if value == "tank" and my_signup.role_tank %}checked{% endif %}{% if value == "damage" and my_signup.role_damage %}checked{% endif %}{% if value == "support" and my_signup.role_support %}checked{% endif %}{% endif %}>
          {% if value == "tank" %}{% include "components/icon.html" with name="role-tank" class="size-4" %}{% elif value == "damage" %}{% include "components/icon.html" with name="role-damage" class="size-4" %}{% else %}{% include "components/icon.html" with name="role-support" class="size-4" %}{% endif %}
          <span>{{ label }}</span>
        </label>
      {% endfor %}
    </div>
    {% if scrim.role_queue %}
      <p class="c-field__help">角色限定内战：勾选的每个位置都要在这个游戏 ID 上填了段位。</p>
    {% else %}
      <p class="c-field__help">不限位置内战：这个游戏 ID 至少填了一个位置的段位即可。</p>
    {% endif %}
  </fieldset>
  <div><button type="submit" class="c-btn c-btn--primary">{% if my_signup %}保存修改{% else %}报名{% endif %}</button></div>
</form>
