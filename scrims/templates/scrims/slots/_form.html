<form method="post" action="{% url 'scrim_signup' scrim.pk %}" class="flex flex-col gap-3">
  {% csrf_token %}
  <label class="form-control">
    <span class="label-text">游戏 ID</span>
    <select name="game_account" class="select select-bordered min-h-11" required>
      {% for account in game_accounts %}
        <option value="{{ account.pk }}" {% if my_signup and my_signup.game_account_id == account.pk %}selected{% endif %}>{{ account.battletag }}</option>
      {% endfor %}
    </select>
  </label>
  <fieldset class="flex flex-wrap gap-4">
    <legend class="label-text">能打的位置（至少一个）</legend>
    {% for value, label in role_choices %}
      <label class="flex items-center gap-2">
        <input type="checkbox" name="roles" value="{{ value }}" class="checkbox"
               {% if my_signup %}{% if value == "tank" and my_signup.role_tank %}checked{% endif %}{% if value == "damage" and my_signup.role_damage %}checked{% endif %}{% if value == "support" and my_signup.role_support %}checked{% endif %}{% endif %}>
        <span>{{ label }}</span>
      </label>
    {% endfor %}
  </fieldset>
  {% if scrim.role_queue %}
    <p class="text-xs text-base-content/60">角色限定内战：勾选的每个位置都要在这个游戏 ID 上填了段位。</p>
  {% else %}
    <p class="text-xs text-base-content/60">不限位置内战：这个游戏 ID 至少填了一个位置的段位即可。</p>
  {% endif %}
  <button type="submit" class="btn btn-primary min-h-11 font-button self-start">{% if my_signup %}保存修改{% else %}报名{% endif %}</button>
</form>
