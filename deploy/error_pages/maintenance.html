
<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8f7">
    <title>维护中 · 上海交通大学守望先锋社区</title>
    
      <style>
/*
 * Error and maintenance pages (design 13.15). Hand-written and independent of
 * the site stylesheet; the values copy the tokens in assets/css/input.css
 * (design 13.2.3) and a test checks they still match.
 */
:root {
  --color-primary: #b2141a;
  --color-primary-deep: #861116;
  --color-primary-container: #ffdad5;
  --color-tertiary-container: #fbdfa6;
  --color-surface: #fff8f7;
  --color-surface-lowest: #ffffff;
  --color-outline: #857371;
  --color-outline-variant: #d8c2bf;
  --color-on-surface: #231918;
  --color-on-surface-2: #534341;
  --color-on-surface-3: #6b5a58;
  --font-fallback:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC",
    "MiSans", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC",
    "Source Han Sans SC", "Noto Sans SC", sans-serif;
  --font-body: var(--font-fallback);
  --font-h1: var(--font-body);
  --font-h1-weight: 700;
  --font-h1-size: 2rem;
  --font-nav: var(--font-body);
  --font-button: var(--font-body);
  --font-figure: var(--font-body);
  --font-code: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

body {
  display: flex;
  flex-direction: column;
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  line-height: 1.7;
  color: var(--color-on-surface);
  background:
    radial-gradient(50% 45% at 8% 10%, color-mix(in oklab, var(--color-primary-container) 80%, transparent), transparent 70%),
    radial-gradient(45% 40% at 95% 90%, color-mix(in oklab, var(--color-tertiary-container) 60%, transparent), transparent 70%),
    var(--color-surface);
  -webkit-font-smoothing: antialiased;
}

header {
  display: flex;
  align-items: center;
  height: 4rem;
  padding: 0 1rem;
  background: color-mix(in oklab, var(--color-surface-lowest) 80%, transparent);
  border-bottom: 1px solid var(--color-outline-variant);
}

header .brand {
  display: inline-flex;
  align-items: center;
  gap: 0.625rem;
  font-family: var(--font-nav);
  font-size: 1.0625rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--color-on-surface);
  text-decoration: none;
}

header .mark {
  width: 2rem;
  height: 2rem;
}

main {
  flex: 1;
  width: 100%;
  max-width: 40rem;
  margin: 0 auto;
  padding: 12vh 1rem 4rem;
}

.code {
  margin: 0;
  font-family: var(--font-figure);
  font-variant-numeric: tabular-nums;
  font-size: 6rem;
  font-weight: 700;
  line-height: 1;
  color: var(--color-primary);
}

.eyebrow {
  margin: 1rem 0 0;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--color-primary-deep);
}

h1 {
  margin: 1rem 0 0.75rem;
  font-family: var(--font-h1);
  font-weight: var(--font-h1-weight);
  font-size: var(--font-h1-size);
  line-height: 1.25;
}

p {
  margin: 0 0 0.5rem;
  color: var(--color-on-surface-2);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 2rem;
}

.actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.5rem 1.5rem;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: var(--font-button);
  font-size: 0.9375rem;
  font-weight: 600;
  text-decoration: none;
  color: var(--color-surface-lowest);
  background: var(--color-primary);
}

.actions a:hover {
  background: var(--color-primary-deep);
}

.actions a.secondary {
  color: var(--color-primary-deep);
  background: transparent;
  border-color: var(--color-outline);
}

.actions a.secondary:hover {
  background: color-mix(in oklab, var(--color-primary) 6%, transparent);
}

.request-id {
  font-family: var(--font-code);
  font-size: 0.875rem;
  color: var(--color-on-surface);
}

footer {
  padding: 1.25rem 1rem;
  border-top: 1px solid var(--color-outline-variant);
  font-size: 0.8125rem;
  color: var(--color-on-surface-3);
}

@media (min-width: 640px) {
  header,
  main,
  footer {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .code {
    font-size: 8rem;
  }
}

      </style>
    
  </head>
  <body>
    <header>
      <a href="/" class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#b2141a"/><path d="M8 21.5l8-8 8 8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="8.6" r="2.4" fill="#fbdfa6"/></svg>交大守望先锋</a>
    </header>
    <main>
      <p class="code" aria-hidden="true">503</p>
      <p class="eyebrow">MAINTENANCE</p>
      
  <h1>网站维护中</h1>
  <p>
    正在升级或暂时无法处理新的请求。已经生成的公开页面仍然可以浏览，请稍后再试需要登录或提交的操作。
  </p>
  <div class="actions">
    <a href="/">回到首页</a>
  </div>

    </main>
    <footer>学生社团自办网站 · 不是上海交通大学官方网站</footer>
  </body>
</html>
