<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>操作太频繁 · 上海交通大学守望先锋社区</title>
    <style>
      :root {
        --font-fallback: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        --font-body: var(--font-fallback);
        --font-h1: var(--font-body);
        --font-h1-weight: 700;
        --font-h1-size: 2rem;
        --font-nav: var(--font-body);
        --font-button: var(--font-body);
        --font-code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        color: #1f2937;
        background: #f8fafc;
      }
      header {
        font-family: var(--font-nav);
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
      }
      header a {
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }
      main {
        max-width: 36rem;
        margin: 12vh auto 0;
        padding: 0 1.5rem 3rem;
        text-align: center;
      }
      h1 {
        font-family: var(--font-h1);
        font-weight: var(--font-h1-weight);
        font-size: var(--font-h1-size);
        margin: 0 0 1rem;
      }
      p { line-height: 1.6; color: #4b5563; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 1.5rem;
      }
      .actions a {
        font-family: var(--font-button);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 1rem;
        border-radius: 0.5rem;
        text-decoration: none;
        color: #fff;
        background: #1f2937;
      }
      .actions a.secondary {
        color: #1f2937;
        background: #fff;
        border: 1px solid #d1d5db;
      }
      .request-id {
        font-family: var(--font-code);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">交大守望先锋</a>
    </header>
    <main>
      
  <h1>操作太频繁</h1>
  <p>请稍后再试。</p>
  <div class="actions">
    <a href="/">回到首页</a>
  </div>

    </main>
  </body>
</html>
