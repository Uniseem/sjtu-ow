name: sjtu-ow

# Design 15.5: rotate container logs. The json-file driver rotates by size, not
# by age, so "keep 14 days" is five files of 10 MB per container (round 063).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/deploy/entrypoint-web.sh"]
    restart: unless-stopped
    logging: *logging
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: sjtu_ow.settings.prod
    volumes:
      - data:/app/data
      - media:/app/media
      - static:/app/staticfiles
      - prerendered:/app/prerendered
      - backups:/app/backups
    expose:
      - "8000"
    healthcheck:
      # Sends the site's Host and X-Forwarded-Proto like Caddy does; a bare
      # request to 127.0.0.1 is a 400 in production (round 053).
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/deploy/entrypoint-worker.sh"]
    restart: unless-stopped
    logging: *logging
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: sjtu_ow.settings.prod
    volumes:
      - data:/app/data
      - media:/app/media
      # Prerendering needs collectstatic's manifest (round 064).
      - static:/app/staticfiles:ro
      - prerendered:/app/prerendered
    depends_on:
      - web

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./error_pages:/srv/error_pages:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - prerendered:/srv/prerendered:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  media:
  static:
  prerendered:
  backups:
  caddy_data:
  caddy_config:
