name: sjtu-ow

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/deploy/entrypoint-web.sh"]
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: sjtu_ow.settings.prod
    volumes:
      - data:/app/data
      - media:/app/media
      - static:/app/staticfiles
      - prerendered:/app/prerendered
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/deploy/entrypoint-worker.sh"]
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: sjtu_ow.settings.prod
    volumes:
      - data:/app/data
      - media:/app/media
      - prerendered:/app/prerendered
    depends_on:
      - web

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./error_pages:/srv/error_pages:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - prerendered:/srv/prerendered:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  media:
  static:
  prerendered:
  caddy_data:
  caddy_config:
