<header class="a-hello">
  <div>
    <h1>你好，{{ nickname }}</h1>
    {% if roles %}<p>{{ roles|join:"、" }}</p>{% endif %}
  </div>
  <nav class="a-actions" aria-label="常用操作">
    {% for action in actions %}
      <a href="{{ action.url }}" class="button{% if not action.primary %} button-secondary{% endif %}"{% if action.url == "/" %} target="_blank" rel="noopener"{% endif %} data-home-action>{{ action.label }}</a>
    {% endfor %}
  </nav>
</header>
