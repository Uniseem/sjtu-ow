<section class="a-block" aria-labelledby="site-todo-heading">
  <h2 id="site-todo-heading">待办{% if rows %} <small>{{ rows|length }} 件</small>{% endif %}</h2>
  {% if rows %}
    <ul class="a-cards site-todo">
      {% for row in rows %}
        <li class="a-card">
          <span>{{ row.text }}</span>
          {% if row.url %}<a href="{{ row.url }}">去处理 →</a>{% endif %}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>暂时没有待办。</p>
  {% endif %}
</section>
