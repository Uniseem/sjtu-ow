{% extends "backoffice/base.html" %}

{% block content %}
  <section class="b-section">
    <p class="b-section__text">确定解散「{{ team.name }}」吗？成员会被清空、待审批的申请会取消，队名可以被其他战队使用。历史报名记录仍然保留。</p>
    <form method="post" class="b-actions">
      {% csrf_token %}
      <button type="submit" class="c-btn c-btn--danger">确认解散</button>
      <a class="c-btn c-btn--secondary" href="{% url 'teams:index' %}">取消</a>
    </form>
  </section>
{% endblock %}
