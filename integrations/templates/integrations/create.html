{% extends "wagtailadmin/generic/base.html" %}

{% block titletag %}新建 API 客户端{% endblock %}

{% block main_content %}
  <form method="post">
    {% csrf_token %}
    <label for="name">上游名称</label>
    <input type="text" id="name" name="name" maxlength="64" required>

    <h2>授权范围</h2>
    {% for value, label in scopes %}
      <p><label><input type="checkbox" name="scopes" value="{{ value }}"> {{ label }}（<code>{{ value }}</code>）</label></p>
    {% endfor %}

    <h2>允许的展开项</h2>
    <p class="help-block">联系方式不属于任何展开项，任何情况下都不会返回。</p>
    {% for value, label in includes %}
      <p><label><input type="checkbox" name="allowed_includes" value="{{ value }}"> {{ label }}（<code>{{ value }}</code>）</label></p>
    {% endfor %}

    <h2>限流</h2>
    <label for="rate">每分钟请求数</label>
    <input type="number" id="rate" name="rate_limit_per_minute" value="600" min="1" max="6000">

    <p>
      <button type="submit" class="button button-primary">创建</button>
      <a class="button button-secondary" href="{% url 'api_client_index' %}">取消</a>
    </p>
  </form>
{% endblock %}
